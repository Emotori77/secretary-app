<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>秘書りな — Personal AI Secretary</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#7c74ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="秘書りな" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="icon" href="/icon.svg" />
  <style>
    :root {
      --accent: #9a7a2b;         /* 落ち着いたゴールド */
      --accent-2: #c6a24d;       /* 明るいシャンパンゴールド */
      --accent-soft: rgba(176,140,60,0.16);
      --btn-bg: linear-gradient(135deg, #b08f3d, #8a6c22);
      --btn-ink: #fffdf5;
      --bg: #f5f1e8;             /* 温かみのあるアイボリー */
      --bg-grad-1: rgba(198,162,77,0.18);
      --bg-grad-2: rgba(120,100,60,0.08);
      --panel: rgba(255,253,246,0.82);
      --panel-solid: #fffdf6;
      --card: rgba(255,253,246,0.82);
      --ink: #211c11;            /* 濃いインク＝高コントラスト */
      --ink-2: #4a4230;
      --muted: #756b52;
      --line: rgba(40,32,12,0.13);
      --line-2: rgba(40,32,12,0.22);
      --warn: #a4692a;           /* 落ち着いた警告色（強い赤は使わない） */
      --warn-bg: rgba(190,130,50,0.15);
      --ok: #4a8f5f;
      --shadow: 0 12px 30px rgba(90,70,25,0.14);
      --radius: 18px;
    }
    html[data-theme="dark"] {
      --accent: #d9b45e;
      --accent-2: #eccf88;
      --accent-soft: rgba(216,180,94,0.18);
      --btn-bg: linear-gradient(135deg, #eccf88, #d3ab52);
      --btn-ink: #241d0a;
      --bg: #100e09;
      --bg-grad-1: rgba(216,180,94,0.16);
      --bg-grad-2: rgba(120,95,50,0.10);
      --panel: rgba(30,26,18,0.80);
      --panel-solid: #1b1710;
      --card: rgba(36,31,22,0.72);
      --ink: #f5efe0;
      --ink-2: #dcd4c0;
      --muted: #a89e85;
      --line: rgba(255,240,210,0.11);
      --line-2: rgba(255,240,210,0.20);
      --warn: #e2b365;
      --warn-bg: rgba(216,170,90,0.16);
      --ok: #6cc08d;
      --shadow: 0 14px 36px rgba(0,0,0,0.55);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(1000px 600px at 88% -8%, var(--bg-grad-1), transparent 60%),
        radial-gradient(900px 600px at -6% 4%, var(--bg-grad-2), transparent 55%),
        var(--bg);
      background-attachment: fixed;
    }
    button { font-family: inherit; cursor: pointer; }

    /* ===== レイアウト ===== */
    .app { display: grid; grid-template-columns: 244px 1fr; min-height: 100vh; }
    /* サイドバー（PC） */
    .sidebar {
      position: sticky; top: 0; align-self: start; height: 100vh;
      padding: 22px 16px; border-right: 1px solid var(--line);
      display: flex; flex-direction: column; gap: 6px;
      background: var(--panel); backdrop-filter: blur(14px);
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 6px 8px 18px; }
    .brand .name { font-weight: 700; letter-spacing: .04em; }
    .brand .sub { font-size: 11px; color: var(--muted); letter-spacing: .12em; }
    .nav-item {
      display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px;
      color: var(--ink-2); background: transparent; border: none; width: 100%; text-align: left;
      font-size: 14px; font-weight: 600; transition: background .15s, color .15s;
    }
    .nav-item .ico { width: 22px; height: 22px; display: grid; place-items: center; color: var(--muted); }
    .nav-item:hover { background: var(--accent-soft); }
    .nav-item.active { background: var(--accent-soft); color: var(--accent); }
    .nav-item.active .ico { color: var(--accent); }
    .nav-item.rina { color: var(--ink); }
    .sidebar .spacer { flex: 1; }
    .theme-btn {
      display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 12px;
      background: transparent; border: 1px solid var(--line-2); color: var(--ink-2); font-size: 13px; font-weight: 600;
    }

    /* メイン */
    .main { min-width: 0; padding: 26px clamp(16px, 4vw, 40px) 120px; }
    .container { max-width: 860px; margin: 0 auto; }

    /* トップバー（モバイル時のみ表示のヘッダ） */
    .topbar { display: none; }

    /* ===== 下部ナビ（モバイル） ===== */
    .bottomnav { display: none; }

    /* ===== オーブ・アバター ===== */
    .orb { position: relative; border-radius: 50%; flex: 0 0 auto; }
    .orb .core {
      position: absolute; inset: 0; border-radius: 50%;
      background: radial-gradient(circle at 34% 30%, #ffffff, var(--accent-2) 42%, var(--accent) 78%);
      box-shadow: 0 0 18px var(--accent-soft), 0 0 40px var(--accent-soft);
    }
    .orb .ring {
      position: absolute; inset: -5px; border-radius: 50%;
      border: 1.5px solid var(--accent); opacity: .5;
      animation: ringPulse 3.4s ease-in-out infinite;
    }
    .orb .ring.r2 { inset: -10px; opacity: .28; animation-delay: .6s; }
    @keyframes ringPulse { 0%,100%{ transform: scale(1); opacity:.5;} 50%{ transform: scale(1.06); opacity:.2;} }
    .orb.thinking .core { animation: think 1.2s ease-in-out infinite; }
    @keyframes think { 0%,100%{ filter: brightness(1);} 50%{ filter: brightness(1.25);} }
    .orb.suggest .ring { border-color: var(--accent); animation-duration: 2s; }
    .orb.alert .core { background: radial-gradient(circle at 34% 30%, #fff, #e6b978 45%, var(--warn) 82%); }
    .orb.alert .ring { border-color: var(--warn); }
    .orb.listening .ring { animation-duration: .9s; }

    /* ===== 見出し・テキスト ===== */
    .greeting { font-size: clamp(20px, 3.6vw, 27px); font-weight: 700; letter-spacing: .01em; margin: 4px 0 2px; }
    .subline { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
    .section-title { font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--muted); margin: 26px 4px 12px; text-transform: uppercase; }

    /* ===== カード ===== */
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 18px; box-shadow: var(--shadow); backdrop-filter: blur(10px);
    }
    .grid { display: grid; gap: 14px; }
    .grid.cols-2 { grid-template-columns: 1fr 1fr; }

    /* 今やること（ヒーロー） */
    .hero {
      position: relative; overflow: hidden; padding: 22px;
      background:
        linear-gradient(135deg, var(--accent-soft), transparent 60%),
        var(--panel-solid);
      border: 1px solid var(--line-2);
    }
    .hero .tag { font-size: 11px; font-weight: 700; letter-spacing: .16em; color: var(--accent); text-transform: uppercase; }
    .hero .htitle { font-size: clamp(19px, 3.4vw, 24px); font-weight: 800; margin: 8px 0 6px; line-height: 1.35; }
    .hero .hmeta { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 16px; }
    .hero .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .hero-empty { color: var(--ink-2); }

    /* 進捗リング */
    .prog { display: flex; align-items: center; gap: 16px; }
    .ring-wrap { width: 74px; height: 74px; flex: 0 0 auto; }
    .prog .big { font-size: 26px; font-weight: 800; }
    .prog .lbl { font-size: 12px; color: var(--muted); }

    /* pill / chip */
    .pill { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; letter-spacing: .04em; white-space: nowrap; }
    .pill.p-urgent { background: rgba(176,125,58,0.16); color: var(--warn); }
    .pill.p-high { background: var(--accent-soft); color: var(--accent); }
    .pill.p-mid { background: rgba(130,135,150,0.14); color: var(--ink-2); }
    .pill.p-low { background: rgba(130,135,150,0.10); color: var(--muted); }
    .chip { font-size: 11px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .due { font-size: 12px; color: var(--ink-2); }
    .due.overdue { color: var(--warn); background: var(--warn-bg); padding: 2px 9px; border-radius: 999px; }
    .postpone { font-size: 11px; color: var(--warn); background: var(--warn-bg); padding: 2px 9px; border-radius: 999px; }

    /* ボタン */
    .btn {
      border: none; border-radius: 12px; padding: 11px 18px; font-size: 14px; font-weight: 700;
      background: var(--btn-bg); color: var(--btn-ink);
      box-shadow: 0 8px 20px var(--accent-soft); transition: transform .08s, filter .15s;
    }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.05); }
    .btn:active { transform: translateY(0); }
    .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line-2); box-shadow: none; }
    .btn.ghost:hover { background: var(--accent-soft); }
    .btn.sm { padding: 7px 13px; font-size: 12.5px; border-radius: 10px; box-shadow: none; }
    .btn.subtle { background: transparent; color: var(--muted); border: 1px solid var(--line); box-shadow: none; }
    .btn.subtle:hover { color: var(--warn); border-color: var(--line-2); }
    .btn.danger { background: transparent; color: var(--warn); border: 1px solid var(--line); box-shadow: none; }
    .btn.danger:hover { background: var(--warn-bg); }

    /* 入力 */
    input[type=text], input[type=date], input[type=time], input[type=number], textarea, select {
      width: 100%; padding: 11px 13px; border: 1px solid var(--line-2); border-radius: 12px;
      font-size: 14px; font-family: inherit; background: var(--panel-solid); color: var(--ink); margin-bottom: 10px;
    }
    textarea { resize: vertical; min-height: 68px; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    label.fld { display: block; font-size: 12px; color: var(--muted); margin: 2px 2px 4px; font-weight: 600; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .form-grid .full { grid-column: 1 / -1; }
    details.more > summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 600; margin: 2px 0 12px; list-style: none; }
    details.more > summary::-webkit-details-marker { display: none; }
    details.more > summary::before { content: "＋ "; }
    details.more[open] > summary::before { content: "－ "; }

    /* フィルタチップ */
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 16px; }
    .filter {
      font-size: 12.5px; font-weight: 600; padding: 7px 13px; border-radius: 999px;
      border: 1px solid var(--line-2); background: transparent; color: var(--ink-2);
    }
    .filter.active { background: var(--accent); color: var(--btn-ink); border-color: var(--accent); }

    /* リスト項目 */
    .item {
      display: flex; align-items: flex-start; gap: 13px; padding: 14px 16px; margin-bottom: 11px;
      border: 1px solid var(--line); border-radius: 14px; background: var(--card); backdrop-filter: blur(8px);
    }
    .item.overdue { border-color: rgba(176,125,58,0.35); }
    .item.done { opacity: .62; }
    .check {
      appearance: none; width: 22px; height: 22px; flex: 0 0 auto; margin-top: 1px;
      border: 1.6px solid var(--accent); border-radius: 7px; background: var(--panel-solid); position: relative; cursor: pointer;
    }
    .check:checked { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: var(--accent); }
    .check:checked::after { content: "✓"; color: var(--btn-ink); font-weight: 900; font-size: 13px; position: absolute; left: 4px; top: -1px; }
    .item .body { flex: 1; min-width: 0; }
    .item .t-title { font-weight: 700; }
    .item.done .t-title { text-decoration: line-through; color: var(--muted); }
    .item .t-detail { font-size: 13px; color: var(--ink-2); margin-top: 3px; white-space: pre-wrap; }
    .item .metarow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 9px; }
    .item .tools { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
    .subtasks { margin: 10px 0 2px; padding-left: 2px; }
    .subtask { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--ink-2); padding: 3px 0; }
    .subtask input { width: 17px; height: 17px; accent-color: var(--accent); }
    .subtask.done span { text-decoration: line-through; color: var(--muted); }

    .empty { text-align: center; color: var(--muted); font-size: 13.5px; padding: 30px 12px; border: 1px dashed var(--line-2); border-radius: 16px; }
    .empty .o { margin: 0 auto 12px; }
    .meta { font-size: 12px; color: var(--muted); }

    .note-item, .review-item {
      border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 12px;
      padding: 14px 16px; margin-bottom: 11px; background: var(--card);
    }
    .note-item .nt { font-weight: 700; }
    .note-item .nb, .review-item .rc { white-space: pre-wrap; color: var(--ink-2); font-size: 14px; margin: 6px 0; }
    .review-item .rw { font-weight: 700; color: var(--accent); font-size: 13px; }
    .week-tag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 4px 12px; margin-bottom: 10px; }

    /* 確認モーダル */
    .overlay {
      position: fixed; inset: 0; background: rgba(10,12,20,0.5); backdrop-filter: blur(3px);
      display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50;
    }
    .overlay.show { display: flex; }
    .modal {
      width: 100%; max-width: 460px; background: var(--panel-solid); border: 1px solid var(--line-2);
      border-radius: 20px; padding: 22px; box-shadow: var(--shadow);
      max-height: 88vh; overflow: auto;
    }
    .filter .cnt { display: inline-block; margin-left: 6px; font-size: 11px; opacity: .8; }
    .assist { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .modal h3 { margin: 0 0 4px; font-size: 16px; }
    .modal .lead { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
    .modal .proposal { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; font-size: 14px; }
    .modal .btns { display: flex; gap: 10px; margin-top: 16px; }
    .modal .btns .btn { flex: 1; }

    /* トースト */
    .toast {
      position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%) translateY(20px);
      background: var(--panel-solid); border: 1px solid var(--line-2); border-radius: 14px;
      padding: 12px 18px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px;
      opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; z-index: 60; font-size: 13.5px; max-width: 90vw;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .spark { width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle, #fff, var(--accent)); box-shadow: 0 0 10px var(--accent); animation: spark 1s ease-out; }
    @keyframes spark { 0%{ transform: scale(.4); opacity: 0; } 40%{ opacity: 1; } 100%{ transform: scale(1); } }

    /* ローディング */
    .skeleton { height: 84px; border-radius: 14px; background: linear-gradient(90deg, var(--card), var(--accent-soft), var(--card)); background-size: 200% 100%; animation: shimmer 1.4s infinite; margin-bottom: 11px; }
    @keyframes shimmer { 0%{ background-position: 200% 0; } 100%{ background-position: -200% 0; } }

    /* サブタブ */
    .subtabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 18px; }
    .subtab { padding: 8px 15px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; color: var(--ink-2); font-weight: 600; font-size: 13px; }
    .subtab.active { background: var(--accent); color: var(--btn-ink); border-color: var(--accent); }

    /* リマインダーバナー */
    .banner { background: var(--warn-bg); border: 1px solid rgba(176,125,58,0.3); color: var(--warn); border-radius: 12px; padding: 11px 14px; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; font-size: 13.5px; }
    .banner .x { margin-left: auto; background: none; border: none; color: var(--warn); font-size: 16px; cursor: pointer; }

    /* カレンダー */
    .cal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .cal-head .lbl { font-weight: 700; font-size: 16px; }
    .cal-views { display: flex; gap: 6px; margin-left: auto; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cal-dow { font-size: 11px; color: var(--muted); text-align: center; padding: 4px 0; font-weight: 600; }
    .cal-cell { min-height: 78px; border: 1px solid var(--line); border-radius: 10px; padding: 6px; background: var(--card); cursor: pointer; overflow: hidden; }
    .cal-cell.other { opacity: .38; }
    .cal-cell.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .cal-cell .d { font-size: 12px; font-weight: 700; }
    .cal-ev { font-size: 10px; background: var(--accent-soft); color: var(--accent); border-radius: 5px; padding: 1px 5px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cal-ev.warn { background: var(--warn-bg); color: var(--warn); }
    .ev-item { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 12px; padding: 13px 15px; margin-bottom: 10px; background: var(--card); }
    .ev-item.warn { border-left-color: var(--warn); }
    .ev-time { font-weight: 700; color: var(--accent); font-size: 13px; }

    /* りなの女性アバター（額装風） */
    .rina-face { display: inline-block; flex: 0 0 auto; border-radius: 16px; padding: 2px; background: linear-gradient(160deg, var(--accent-2), var(--accent) 55%, #5b52cf); box-shadow: 0 8px 22px var(--accent-soft); }
    .rina-face .inner { width: 100%; height: 100%; border-radius: 14px; overflow: hidden; background: radial-gradient(120% 90% at 50% 12%, #fbfaff, #eae6f7); display: grid; place-items: end center; }
    html[data-theme="dark"] .rina-face .inner { background: radial-gradient(120% 90% at 50% 12%, #2a2c3a, #1a1c28); }
    .rina-face svg { width: 96%; height: auto; display: block; }

    /* チャット */
    .chat-log { display: flex; flex-direction: column; gap: 10px; margin: 8px 0 12px; min-height: 120px; }
    .msg.rina-row { display: flex; align-items: flex-end; gap: 8px; align-self: flex-start; max-width: 90%; background: none; border: none; padding: 0; }
    .msg.rina-row .rina-face { width: 30px; height: 33px; }
    .msg.rina-row .bubbletext { background: var(--card); border: 1px solid var(--line); border-radius: 16px; border-bottom-left-radius: 5px; padding: 11px 15px; font-size: 14px; white-space: pre-wrap; line-height: 1.55; }
    .msg { max-width: 84%; padding: 11px 15px; border-radius: 16px; font-size: 14px; white-space: pre-wrap; line-height: 1.55; }
    .msg.user { align-self: flex-end; background: var(--btn-bg); color: var(--btn-ink); border-bottom-right-radius: 5px; }
    .msg.rina { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
    .chat-input { display: flex; gap: 10px; margin-top: 6px; }
    .quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 10px; }
    .quick button { font-size: 12.5px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; color: var(--accent); font-weight: 600; }

    /* 目標 */
    .goal-item { border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; background: var(--card); }
    .goal-item .g-title { font-weight: 700; font-size: 15px; }
    .pbar { height: 8px; border-radius: 999px; background: var(--line-2); overflow: hidden; margin: 10px 0 6px; }
    .pbar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .3s; }

    /* デイリー気分 */
    .mood { display: flex; gap: 8px; margin-bottom: 10px; }
    .mood button { flex: 1; padding: 9px 0; border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel-solid); font-size: 20px; }
    .mood button.sel { border-color: var(--accent); background: var(--accent-soft); transform: scale(1.05); }
    .stars { display: flex; gap: 6px; }
    .stars button { background: none; border: none; font-size: 22px; color: var(--line-2); }
    .stars button.sel { color: var(--accent); }

    /* トグルスイッチ */
    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-row .tl { font-size: 14px; } .toggle-row .td { font-size: 12px; color: var(--muted); }
    .switch { width: 46px; height: 27px; border-radius: 999px; background: var(--line-2); position: relative; cursor: pointer; border: none; flex: 0 0 auto; transition: background .15s; }
    .switch.on { background: var(--accent); }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%; background: #fff; transition: left .15s; }
    .switch.on::after { left: 22px; }

    /* ナビの期限切れバッジ */
    .navbadge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--warn); color: #fff; font-size: 10px; font-weight: 800; margin-left: 6px; }
    .bn { position: relative; }
    .bn .navbadge { position: absolute; top: -2px; right: 22%; margin: 0; }

    /* フォーカスタイマー（25分集中） */
    .focus { position: fixed; right: 18px; bottom: 92px; z-index: 55; width: 210px; background: var(--panel-solid); border: 1px solid var(--line-2); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); display: none; }
    .focus.show { display: block; animation: fade .25s ease; }
    .focus .ftitle { font-size: 12px; color: var(--muted); }
    .focus .fname { font-weight: 700; font-size: 13px; margin: 2px 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .focus .ftime { font-family: var(--serif); font-size: 34px; font-weight: 700; text-align: center; letter-spacing: .04em; }
    .focus .fbar { height: 5px; border-radius: 999px; background: var(--line-2); overflow: hidden; margin: 10px 0 12px; }
    .focus .fbar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
    .focus .fbtns { display: flex; gap: 8px; }
    .focus .fbtns .btn { flex: 1; padding: 8px; font-size: 12.5px; }
    @media (min-width: 861px) { .focus { bottom: 24px; } }

    /* 全体検索 */
    .search-overlay { position: fixed; inset: 0; background: rgba(10,12,20,0.5); backdrop-filter: blur(3px); display: none; align-items: flex-start; justify-content: center; padding: 60px 16px; z-index: 58; }
    .search-overlay.show { display: flex; }
    .search-panel { width: 100%; max-width: 560px; background: var(--panel-solid); border: 1px solid var(--line-2); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; max-height: 78vh; display: flex; flex-direction: column; }
    .search-panel input { margin: 0; border: none; border-bottom: 1px solid var(--line); border-radius: 0; padding: 16px 18px; font-size: 16px; }
    .search-panel input:focus { box-shadow: none; }
    .search-results { overflow: auto; padding: 8px; }
    .sr { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 12px; cursor: pointer; }
    .sr:hover { background: var(--accent-soft); }
    .sr .kind { font-size: 10px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 8px; flex: 0 0 auto; }
    .sr .txt { flex: 1; min-width: 0; }
    .sr .txt .st { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sr .txt .ss { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .search-empty { padding: 26px; text-align: center; color: var(--muted); font-size: 13.5px; }
    .icon-btn { background: transparent; border: 1px solid var(--line-2); color: var(--ink-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
    .icon-btn:hover { background: var(--accent-soft); color: var(--accent); }

    .view { display: none; }
    .view.active { display: block; animation: fade .25s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none; } }

    /* ===== モバイル ===== */
    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .main { padding: 16px 16px 108px; }
      .topbar {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        position: sticky; top: 0; z-index: 20; margin: -16px -16px 10px; padding: 12px 16px;
        background: var(--panel); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
      }
      .topbar .tb-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
      .form-grid { grid-template-columns: 1fr; }
      .grid.cols-2 { grid-template-columns: 1fr; }
      .bottomnav {
        display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
        justify-content: space-around; align-items: flex-end;
        padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); gap: 4px;
        background: var(--panel); backdrop-filter: blur(16px); border-top: 1px solid var(--line);
      }
      .bn {
        flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
        background: transparent; border: none; color: var(--muted); font-size: 10.5px; font-weight: 600; padding: 4px 0;
      }
      .bn .ico { width: 24px; height: 24px; display: grid; place-items: center; }
      .bn.active { color: var(--accent); }
      .bn.center { margin-top: -22px; }
      .bn.center .orb-wrap { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
        background: var(--panel-solid); border: 1px solid var(--line-2); box-shadow: var(--shadow); }
      .bn.center.active { color: var(--accent); }
    }

<body>

  <!-- 確認モーダル -->

  <!-- フォーカスタイマー -->
  <div class="focus" id="focus">
    <div class="ftitle">集中中</div>

  <!-- 全体検索 -->

    <div class="search-panel">
      <input type="text" id="search-input" placeholder="🔍 タスク・メモ・予定・目標を検索…" oninput="runSearch(this.value)" onkeydown="if(event.key==='Escape')closeSearch()" />
      <div class="search-results" id="search-results"></div>

  <!-- トースト -->
  <div class="toast" id="toast"><span class="spark"></span><span id="toast-msg"></span><button id="toast-action" class="btn sm ghost" style="display:none;padding:5px 11px"></button></div>

  <script>
    // ================= 定数・状態 =================
    const API_BASE = location.protocol.startsWith('http') ? '' : 'http://localhost:3000';
    const CATEGORIES = ['仕事', 'EmoTori', 'プライベート', '健康', 'お金', 'その他'];
    const PRIORITIES = [
      { v: 'urgent', l: '最優先' }, { v: 'high', l: '高' }, { v: 'mid', l: '中' }, { v: 'low', l: '低' },
    ];
    const PRI_LABEL = { urgent: '最優先', high: '高', mid: '中', low: '低' };
    const PRI_RANK = { urgent: 0, high: 1, mid: 2, low: 3 };
    const USER = '生田さま';

    const state = {
      data: null, view: 'home', taskFilter: 'all', loading: true,
      recordTab: 'notes', calView: 'month', calCursor: new Date(),
      noteSearch: '', noteSort: 'updated', chat: [], dailyComment: '',
    };
    // 通知設定の既定値
    const DEFAULT_NOTIFY = { eventBefore: true, taskDue: true, overdue: true, morning: true, night: true, weekly: true, stale: true, morningTime: '08:00', nightTime: '21:00' };
    function notifyPrefs() { return { ...DEFAULT_NOTIFY, ...((state.data && state.data.prefs && state.data.prefs.notify) || {}) }; }

    // ================= 通信 =================
    async function api(url, method = 'GET', body) {
      const opt = { method, headers: { 'Content-Type': 'application/json' } };
      if (body) opt.body = JSON.stringify(body);
      const res = await fetch(API_BASE + url, opt);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '通信エラー');
      return data;
    }
    async function loadData() {
      state.loading = true; renderCurrent();
      try {
        state.data = await api('/api/data');
      } catch (e) {
        state.data = { notes: [], tasks: [], reviews: [], events: [], goals: [], dailyReviews: [], prefs: {} };
        alert('データの読み込みに失敗しました: ' + e.message);
      }
      state.loading = false; renderCurrent();
    }

    // ================= ユーティリティ =================
    function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function pad(n) { return String(n).padStart(2, '0'); }
    function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
    function fmtDateTime(iso) { const d = new Date(iso); return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
    function greetWord() { const h = new Date().getHours(); if (h < 5) return 'こんばんは'; if (h < 11) return 'おはようございます'; if (h < 18) return 'こんにちは'; return 'こんばんは'; }
    function timeBand() { const h = new Date().getHours(); if (h < 11) return 'morning'; if (h < 18) return 'noon'; return 'night'; }

    function taskDue(t) { if (!t.dueDate) return null; return new Date(t.dueDate + 'T' + (t.dueTime || '23:59') + ':00'); }
    function isOverdue(t) { if (t.done || !t.dueDate) return false; return taskDue(t) < new Date(); }
    function isToday(t) { return t.dueDate === todayStr(); }
    function weekRange() {
      const now = new Date(); const dow = (now.getDay() + 6) % 7;
      const mon = new Date(now); mon.setDate(now.getDate() - dow); mon.setHours(0, 0, 0, 0);
      const sun = new Date(mon); sun.setDate(mon.getDate() + 6); sun.setHours(23, 59, 59, 999);
      return { mon, sun };
    }
    function isThisWeek(t) { if (!t.dueDate) return false; const d = taskDue(t); const { mon, sun } = weekRange(); return d >= mon && d <= sun; }
    function dueLabel(t) {
      if (!t.dueDate) return '';
      const md = t.dueDate.slice(5).replace('-', '/');
      const tm = t.dueTime ? ' ' + t.dueTime : '';
      if (isToday(t)) return '今日' + tm;
      return md + tm;
    }

    // データ・アクセサ
    function events() { return state.data.events || []; }
    function goals() { return state.data.goals || []; }
    function dailies() { return state.data.dailyReviews || []; }
    function notes() { return state.data.notes || []; }

    // 日付ユーティリティ
    function ymd(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
    function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
    function eventsOn(dateStr) { return events().filter((e) => e.date === dateStr).sort((a, b) => (a.startTime || '').localeCompare(b.startTime || '')); }
    function timeToMin(t) { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; }
    function eventsOverlap(a, b) {
      if (a.date !== b.date) return false;
      const as = timeToMin(a.startTime), ae = timeToMin(a.endTime) ?? (as != null ? as + 60 : null);
      const bs = timeToMin(b.startTime), be = timeToMin(b.endTime) ?? (bs != null ? bs + 60 : null);
      if (as == null || bs == null) return false;
      return as < be && bs < ae;
    }
    function hasOverlap(ev) { return events().some((e) => e.id !== ev.id && eventsOverlap(e, ev)); }
    const MOODS = ['😞', '😕', '😐', '🙂', '😄'];

    function incompleteTasks() { return (state.data.tasks || []).filter((t) => !t.done); }
    function pickTopTask() {
      const arr = incompleteTasks().slice();
      arr.sort((a, b) => {
        const ao = isOverdue(a) ? 0 : 1, bo = isOverdue(b) ? 0 : 1; if (ao !== bo) return ao - bo;
        if (PRI_RANK[a.priority] !== PRI_RANK[b.priority]) return PRI_RANK[a.priority] - PRI_RANK[b.priority];
        const ad = taskDue(a), bd = taskDue(b);
        if (ad && bd) return ad - bd; if (ad) return -1; if (bd) return 1;
        return (b.postponeCount || 0) - (a.postponeCount || 0);
      });
      return arr[0] || null;
    }
    function todayProgress() {
      const tasks = state.data.tasks || [];
      const set = tasks.filter((t) => (t.dueDate === todayStr()) || isOverdue(t) || (t.done && t.completedAt && t.completedAt.slice(0, 10) === todayStr()));
      const done = set.filter((t) => t.done).length;
      return { done, total: set.length, pct: set.length ? Math.round(done / set.length * 100) : 0 };
    }
    function suggestions() {
      const tasks = state.data.tasks || []; const inc = incompleteTasks();
      const out = [];
      const overdue = inc.filter(isOverdue);
      if (overdue.length) out.push(`期限を過ぎたタスクが ${overdue.length} 件あります。まず1件だけ、今日中に片づけませんか？`);
      const stuck = inc.find((t) => (t.postponeCount || 0) >= 2);
      if (stuck) out.push(`『${stuck.title}』は ${stuck.postponeCount} 回延期されています。25分だけ着手してみませんか？`);
      const noDue = inc.filter((t) => !t.dueDate);
      if (noDue.length >= 3) out.push(`期限未設定のタスクが ${noDue.length} 件あります。今日やる分だけ期限を決めましょうか。`);
      if (timeBand() === 'night') out.push('本日もお疲れさまでした。3分だけ、今日の振り返りをしませんか？');
      if (!inc.length && tasks.length) out.push('未完了のタスクはありません。よく整いています。');
      if (!out.length) out.push('まずはタスクを1件、登録してみましょう。今日の一歩から始めます。');
      return out.slice(0, 3);
    }
    function orbState() {
      if (incompleteTasks().some(isOverdue)) return 'alert';
      if (suggestions().length) return 'suggest';
      return 'idle';
    }

    // ================= ナビ・テーマ =================
    function go(view) {
      state.view = view;
      document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === 'view-' + view));
      document.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('active', b.dataset.view === view));
      renderCurrent();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('rina-theme', next); } catch (e) {}
      const dark = next === 'dark';
      document.getElementById('theme-label').textContent = dark ? 'ライトモード' : 'ダークモード';
      const g = dark ? '☀' : '◐';
      document.getElementById('theme-ico').textContent = g;
      document.getElementById('theme-ico2').textContent = g;
    }
    (function initTheme() {
      let t = 'light'; try { t = localStorage.getItem('rina-theme') || 'light'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();

    function orbHTML(size, cls) { return `<span class="orb ${cls || ''}" style="width:${size}px;height:${size}px"><span class="core"></span><span class="ring"></span><span class="ring r2"></span></span>`; }
    // りなの女性アバター（架空のオリジナル。以前のイラストを額装風で表示）
    function rinaAvatar(size) {
      return `<span class="rina-face" style="width:${size}px;height:${Math.round(size * 1.1)}px"><span class="inner">
        <svg viewBox="0 0 120 128" xmlns="http://www.w3.org/2000/svg" aria-label="秘書のりな">
          <defs>
            <linearGradient id="rhair" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0" stop-color="#4b3225"/><stop offset="0.5" stop-color="#38241a"/><stop offset="1" stop-color="#2b1a12"/></linearGradient>
            <linearGradient id="rskin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe2cf"/><stop offset="1" stop-color="#f6c8a9"/></linearGradient>
            <linearGradient id="rcardi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3550"/><stop offset="1" stop-color="#26223a"/></linearGradient>
            <radialGradient id="rblush" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff9fb0" stop-opacity="0.7"/><stop offset="1" stop-color="#ff9fb0" stop-opacity="0"/></radialGradient>
          </defs>
          <path d="M27 60c0-25 14-42 33-42s33 17 33 42c0 20 3 42 5 58H22c2-16 5-38 5-58z" fill="url(#rhair)"/>
          <path d="M22 128c1-16 12-27 26-31l12-3 12 3c14 4 25 15 26 31z" fill="url(#rcardi)"/>
          <path d="M46 98c4 8 10 12 14 12s10-4 14-12l-14-5z" fill="#f4f1ea"/>
          <path d="M60 100l-4 6 4 22 4-22z" fill="#e3ddce"/>
          <path d="M52 84c0 8-1 12-2 15 3 4 17 4 20 0-1-3-2-7-2-15z" fill="url(#rskin)"/>
          <path d="M52 90c3 4 13 4 16 0v-3c-4 3-12 3-16 0z" fill="#e8ac89" opacity=".6"/>
          <path d="M36 56c0-17 10-30 24-30s24 13 24 30c0 19-11 33-24 33S36 75 36 56z" fill="url(#rskin)"/>
          <ellipse cx="46" cy="66" rx="6" ry="4.5" fill="url(#rblush)"/><ellipse cx="74" cy="66" rx="6" ry="4.5" fill="url(#rblush)"/>
          <path d="M44 50c4-2 10-2 13 0" fill="none" stroke="#3a2519" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M63 50c3-2 9-2 13 0" fill="none" stroke="#3a2519" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M45 58c3-3 10-3 13 0" fill="none" stroke="#2a1c14" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M62 58c3-3 10-3 13 0" fill="none" stroke="#2a1c14" stroke-width="1.2" stroke-linecap="round"/>
          <ellipse cx="51.5" cy="59.5" rx="3.1" ry="3.7" fill="#43302340"/><circle cx="51.5" cy="60" r="2.7" fill="#4a3326"/><circle cx="51.5" cy="60" r="1.2" fill="#1c120c"/><circle cx="52.6" cy="58.8" r="0.9" fill="#fff"/>
          <ellipse cx="68.5" cy="59.5" rx="3.1" ry="3.7" fill="#43302340"/><circle cx="68.5" cy="60" r="2.7" fill="#4a3326"/><circle cx="68.5" cy="60" r="1.2" fill="#1c120c"/><circle cx="69.6" cy="58.8" r="0.9" fill="#fff"/>
          <path d="M46 57l-1.5-1.6M75 57l1.5-1.6" stroke="#2a1c14" stroke-width="1" stroke-linecap="round"/>
          <path d="M59 62c-1 4-2 6-3 7 1 1.4 4 1.4 5 0" fill="none" stroke="#e0a888" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

    // 重要度の並び（期限切れ→優先度→期限が近い→延期が多い順）
    function importanceCmp(a, b) {
      const ao = isOverdue(a) ? 0 : 1, bo = isOverdue(b) ? 0 : 1; if (ao !== bo) return ao - bo;
      if (PRI_RANK[a.priority] !== PRI_RANK[b.priority]) return PRI_RANK[a.priority] - PRI_RANK[b.priority];
      const ad = taskDue(a), bd = taskDue(b);
      if (ad && bd) return ad - bd; if (ad) return -1; if (bd) return 1;
      return (b.postponeCount || 0) - (a.postponeCount || 0);
    }
    function tasksFor(f) {
      const tasks = state.data.tasks || [];
      if (f === 'done') return tasks.filter((t) => t.done);
      const inc = tasks.filter((t) => !t.done);
      if (f === 'today') return inc.filter((t) => isToday(t) || isOverdue(t));
      if (f === 'week') return inc.filter((t) => isThisWeek(t) || isOverdue(t));
      if (f === 'overdue') return inc.filter(isOverdue);
      if (f.startsWith('cat:')) return inc.filter((t) => t.category === f.slice(4));
      return inc; // all
    }
    function countFor(f) { return tasksFor(f).length; }
    function filteredTasks() {
      const f = state.taskFilter; const arr = tasksFor(f).slice();
      if (f === 'done') arr.sort((a, b) => new Date(b.completedAt || 0) - new Date(a.completedAt || 0));
      else arr.sort(importanceCmp);
      return arr;
    }
    function setFilter(v) { state.taskFilter = v; renderTasks(); }

          ${t.detail ? `<div class="t-detail">${esc(t.detail)}</div>` : ''}

            <span class="chip">${esc(t.category)}</span>
            ${t.dueDate ? `<span class="due ${over ? 'overdue' : ''}">${over ? '期限超過 ' : '期限 '}${dueLabel(t)}</span>` : ''}
            ${t.estimateMin ? `<span class="meta">目安 ${t.estimateMin}分</span>` : ''}
            ${t.repeat !== 'none' ? `<span class="meta">🔁 ${({ daily: '毎日', weekly: '毎週', monthly: '毎月' })[t.repeat]}</span>` : ''}
            ${(t.postponeCount || 0) > 0 ? `<span class="postpone">${t.postponeCount}回 延期</span>` : ''}
            ${t.relatedGoal ? `<span class="meta">🎯 ${esc(t.relatedGoal)}</span>` : ''}
          </div>
          ${t.subtasks && t.subtasks.length ? `<div class="subtasks">${t.subtasks.map((s, i) => `<label class="subtask ${s.done ? 'done' : ''}"><input type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleSub('${t.id}',${i},this.checked)"><span>${esc(s.title)}</span></label>`).join('')}</div>` : ''}
          <div class="tools">
            <button class="btn sm subtle" onclick="editTask('${t.id}')">編集</button>
            ${!t.done ? `<button class="btn sm ghost" onclick="startFocus('${t.id}')">25分集中</button>` : ''}
            ${!t.done ? `<button class="btn sm subtle" onclick="postponeTask('${t.id}')">明日に延期</button>` : ''}
            ${!t.done && (!t.subtasks || !t.subtasks.length) ? `<button class="btn sm ghost" onclick="decompose('${t.id}')">りなに分解してもらう</button>` : ''}
            <button class="btn sm danger" onclick="removeTask('${t.id}')">削除</button>
          </div>
        </div>
      </div>`;

    function monthGrid(c) {
      const first = new Date(c.getFullYear(), c.getMonth(), 1);
      const startDow = (first.getDay() + 6) % 7; // 月曜始まり
      const start = addDays(first, -startDow);
      const dows = ['月', '火', '水', '木', '金', '土', '日'];
      let cells = '';
      for (let i = 0; i < 42; i++) {
        const d = addDays(start, i); const ds = ymd(d);
        const other = d.getMonth() !== c.getMonth();
        const evs = eventsOn(ds);
        const shown = evs.slice(0, 2).map((e) => `<div class="cal-ev ${hasOverlap(e) ? 'warn' : ''}">${esc((e.startTime ? e.startTime + ' ' : '') + e.title)}</div>`).join('');
        const more = evs.length > 2 ? `<div class="cal-ev" style="background:transparent;color:var(--muted)">+${evs.length - 2}</div>` : '';
        cells += `<div class="cal-cell ${other ? 'other' : ''} ${ds === todayStr() ? 'today' : ''}" onclick="openDay('${ds}')"><div class="d">${d.getDate()}</div>${shown}${more}</div>`;
        if (i === 41 && d.getMonth() !== c.getMonth() && i % 7 === 6 && d > new Date(c.getFullYear(), c.getMonth() + 1, 0)) break;
      }
      return `<div class="cal-grid">${dows.map((w) => `<div class="cal-dow">${w}</div>`).join('')}${cells}</div>`;
    }
    function dayBlock(d, detailed) {
      const ds = ymd(d); const evs = eventsOn(ds);
      const head = `<div style="font-weight:700;font-size:13px;margin:14px 0 8px;color:${ds === todayStr() ? 'var(--accent)' : 'var(--ink)'}">${d.getMonth() + 1}/${d.getDate()}（${'日月火水木金土'[d.getDay()]}）</div>`;
      if (!evs.length) return head + '<div class="meta" style="padding-bottom:6px">予定なし</div>';
      return head + evs.map((e) => {
        const ov = hasOverlap(e);
        return `<div class="ev-item ${ov ? 'warn' : ''}">
          <div style="display:flex;gap:10px"><span class="ev-time">${e.startTime || '終日'}${e.endTime ? '〜' + e.endTime : ''}</span><div style="flex:1"><div style="font-weight:700">${esc(e.title)}</div>
          ${e.place ? `<div class="meta">📍 ${esc(e.place)}</div>` : ''}
          ${(e.items || e.prepare) ? `<div class="meta">🧳 ${esc([e.prepare, e.items].filter(Boolean).join(' / '))}</div>` : ''}
          ${detailed && e.detail ? `<div class="t-detail">${esc(e.detail)}</div>` : ''}
          ${ov ? '<div class="meta" style="color:var(--warn)">⚠ 同じ時間帯に別の予定があります</div>' : ''}</div></div>
          <div class="tools"><button class="btn sm subtle" onclick="editEvent('${e.id}')">編集</button><button class="btn sm danger" onclick="removeEvent('${e.id}')">削除</button></div>
        </div>`;
      }).join('');
    }

    function skeletons(n) { return '<div class="skeleton"></div>'.repeat(n); }
    function emptyBox(msg) { return `<div class="empty">${orbHTML(40)}<div style="margin-top:12px">${esc(msg)}</div></div>`; }
    function currentWeekLabel() {
      const now = new Date(); const dow = (now.getDay() + 6) % 7;
      const mon = new Date(now); mon.setDate(now.getDate() - dow);
      const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
      const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
      const dn = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - dn + 3);
      const ft = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
      const wk = 1 + Math.round(((d - ft) / 86400000 - 3 + ((ft.getUTCDay() + 6) % 7)) / 7);
      const md = (x) => `${x.getMonth() + 1}/${x.getDate()}`;
      return `${mon.getFullYear()}年 第${wk}週（${md(mon)}〜${md(sun)}）`;
    }

    // ================= 操作（タスク） =================
    function fieldVal(id) { const e = document.getElementById(id); return e ? e.value : ''; }
    async function addTask() {
      const title = fieldVal('t-title').trim();
      if (!title) { alert('タスク名を入力してください'); return; }
      const estimate = fieldVal('t-estimate');
      const payload = {
        title,
        detail: fieldVal('t-detail').trim(),
        dueDate: fieldVal('t-date'),
        dueTime: fieldVal('t-time'),
        priority: fieldVal('t-priority') || 'mid',
        category: fieldVal('t-category') || 'その他',
        estimateMin: estimate ? Number(estimate) : null,
        repeat: fieldVal('t-repeat') || 'none',
        relatedGoal: fieldVal('t-goal').trim(),
      };
      try { await api('/api/tasks', 'POST', payload); await refresh(); toast('タスクを追加しました。'); }
      catch (e) { alert('追加に失敗しました: ' + e.message); }
    }
    async function toggleTask(id, done) {
      try { await api('/api/tasks/' + id, 'PATCH', { done }); await refresh(); if (done) toast(completeMsg(), { label: '取り消す', fn: () => toggleTask(id, false) }); }
      catch (e) { alert('更新に失敗しました: ' + e.message); }
    }
    // 削除の取り消し（元のデータを再登録）
    async function restore(url, obj) {
      try { await api(url, 'POST', obj); await refresh(); toast('元に戻しました。'); }
      catch (e) { alert('復元に失敗しました: ' + e.message); }
    }
    async function completeTask(id) { await toggleTask(id, true); }
    function completeMsg() {
      const inc = incompleteTasks().length;
      return inc ? `完了しました。残りの未完了は ${inc} 件です。` : '完了しました。本日の対象はすべて片づきました。';
    }
    async function postponeTask(id) {
      try { await api('/api/tasks/' + id, 'PATCH', { postpone: true }); await refresh(); toast('明日に延期しました。無理のない範囲で進めましょう。'); }
      catch (e) { alert('延期に失敗しました: ' + e.message); }
    }
    // りなに任せる：今日の優先順位を提案（データは変更しない）
    function rinaPrioritize() {
      const arr = incompleteTasks().slice().sort(importanceCmp).slice(0, 5);
      if (!arr.length) { toast('未完了のタスクはありません。よく整っています。'); return; }
      const body = arr.map((t, i) => `<div class="proposal">${i + 1}. ${esc(t.title)}　<span class="meta">${PRI_LABEL[t.priority]}${t.dueDate ? '・' + dueLabel(t) : ''}</span></div>`).join('');
      openModal({
        title: '今日の優先順位です', lead: 'この順番で進めると効率的です。上から1件ずつ、まず25分だけ。', bodyHTML: body,

    // りなに任せる：今日の空き時間にタスクを割り当てる（今日の予定を避けて配置）
    function rinaSchedule() {
      const now = new Date();
      const startMin = Math.max(now.getHours() * 60 + now.getMinutes(), 9 * 60);
      const endMin = 21 * 60;
      const busy = eventsOn(todayStr()).filter((e) => timeToMin(e.startTime) != null)
        .map((e) => { const s = timeToMin(e.startTime); return [s, timeToMin(e.endTime) ?? s + 60]; }).sort((a, b) => a[0] - b[0]);
      const tasks = incompleteTasks().slice().sort(importanceCmp);
      const plan = []; let cur = startMin;
      for (const t of tasks) {
        const dur = t.estimateMin || 30; let placed = false;
        while (cur + dur <= endMin) {
          const hit = busy.find(([s, e]) => cur < e && s < cur + dur);
          if (hit) { cur = hit[1]; continue; }
          plan.push({ task: t, start: cur, end: cur + dur }); cur += dur; placed = true; break;
        }
        if (!placed || plan.length >= 6) break;
      }
      if (!plan.length) { toast('今日の空き時間に割り当てられるタスクがありません。'); return; }
      const fmt = (m) => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
      const body = plan.map((p) => `<div class="proposal">${fmt(p.start)}–${fmt(p.end)}　${esc(p.task.title)}<span class="meta">（${p.task.estimateMin || 30}分）</span></div>`).join('');
      openModal({
        title: '空き時間に割り当てますか？', lead: '今日の予定を避けて時間を割り当てました。各タスクの期限を今日のこの時刻に設定します。', bodyHTML: body, okLabel: 'この予定で設定',
        onOk: async () => {
          try { for (const p of plan) await api('/api/tasks/' + p.task.id, 'PATCH', { dueDate: todayStr(), dueTime: fmt(p.start) }); await refresh(); closeModal(); toast('空き時間にタスクを割り当てました。'); }
          catch (e) { alert('割り当てに失敗しました: ' + e.message); }
        },
      });
    }

          if (!lines.length) { closeModal(); return; }
          try { for (const s of lines) await api('/api/tasks', 'POST', { title: s, category: n.category === '未分類' ? 'その他' : n.category }); await refresh(); closeModal(); toast(`${lines.length} 件をタスクに登録しました。`); }
          catch (e) { alert('登録に失敗しました: ' + e.message); }
        },
      });
    }

    // ================= りな（ルールベース対話） =================
    async function sendChat(text) {
      text = (text || '').trim(); if (!text) return;
      state.chat.push({ who: 'user', text });
      const box = document.getElementById('chat-text'); if (box) box.value = '';
      // ルールベースの応答と操作候補（データ変更は必ず確認カードで）
      const local = rinaReply(text);
      state.chat.push({ who: 'rina', text: '…' }); renderRina();
      let reply = local.reply;
      // LLMが有効なら、より自然な返答文に差し替え（キーはサーバー側のみ）
      try { const r = await api('/api/chat', 'POST', { message: text, context: chatContext() }); if (r && r.reply) reply = r.reply; } catch (e) {}
      state.chat[state.chat.length - 1] = { who: 'rina', text: reply };
      renderRina();
      if (local.proposal) setTimeout(local.proposal, 250);
    }
    function chatContext() {
      const inc = incompleteTasks(); const top = pickTopTask(); const te = eventsOn(todayStr());
      return `未完了タスク${inc.length}件、うち期限切れ${inc.filter(isOverdue).length}件、今日の予定${te.length}件。最優先タスク: ${top ? top.title : 'なし'}。`;
    }
    function rinaReply(text) {
      const t = text;
      // 予定の追加
      if (/(予定|会議|ジム|面談|行く|訪問|アポ).*(追加|入れて|登録)|(追加|入れて).*(予定)/.test(t) || /(明日|今日|明後日).*\d/.test(t)) {
        const p = parseWhen(t);
        const title = guessTitle(t);
        return {
          reply: `承知しました。次の予定でよろしいですか？ 確認カードを表示します。`,
          proposal: () => openModal({
            title: '次の予定を追加しますか？', lead: '内容をご確認ください。',
            bodyHTML: `<div class="proposal">予定：${esc(title)}<br>日付：${esc(p.date)}${p.time ? '　' + esc(p.time) : ''}</div>`,
            okLabel: '追加する',
            onOk: async () => { try { await api('/api/events', 'POST', { title, date: p.date, startTime: p.time || '' }); await refresh(); closeModal(); toast('予定を追加しました。'); } catch (e) { alert(e.message); } },
          }),
        };
      }
      // タスクの追加
      if (/(タスク).*(追加|にして|登録)|(やること|todo).*(追加)/i.test(t)) {
        const title = guessTitle(t);
        return {
          reply: 'タスクの登録候補を作成しました。確認カードをご覧ください。',
          proposal: () => openModal({ title: '次のタスクを追加しますか？', lead: '内容をご確認ください。', bodyHTML: `<div class="proposal">タスク：${esc(title)}</div>`, okLabel: '追加する', onOk: async () => { try { await api('/api/tasks', 'POST', { title }); await refresh(); closeModal(); toast('タスクを追加しました。'); } catch (e) { alert(e.message); } } }),
        };
      }
      // 今日やること
      if (/(今日).*(何|やる|すれば)|やること/.test(t)) {
        const top = pickTopTask(); const inc = incompleteTasks();
        if (!inc.length) return { reply: '本日の未完了タスクはありません。まずは1件、決めてみましょうか。' };
        return { reply: `未完了は ${inc.length} 件です。最優先は「${top.title}」。${(top.postponeCount || 0) > 0 ? `${top.postponeCount}回延期中なので、まず25分だけ着手してみませんか？` : 'ここから始めましょう。'}` };
      }
      // 今週の予定・整理
      if (/(今週).*(予定|整理|タスク)/.test(t)) {
        const { mon, sun } = weekRange();
        const evs = events().filter((e) => { const d = new Date(e.date + 'T00:00:00'); return d >= mon && d <= sun; });
        const wt = incompleteTasks().filter((x) => isThisWeek(x));
        return { reply: `今週の予定は ${evs.length} 件、期限が今週のタスクは ${wt.length} 件です。${wt.length ? '「タスク」の“今週”フィルタで一覧できます。' : ''}` };
      }
      // 最近できていない
      if (/(最近|放置).*(できて|放置|ため)/.test(t)) {
        const stuck = incompleteTasks().filter((x) => (x.postponeCount || 0) >= 1 || isOverdue(x));
        if (!stuck.length) return { reply: '大きく滞っているものはありません。よく整っています。' };
        return { reply: `気になるのは：${stuck.slice(0, 3).map((x) => '「' + x.title + '」').join('、')}。まず1件だけ、今日着手しませんか？` };
      }
      // 振り返りまとめ
      if (/(振り返り|今日|今週).*(まとめ|まとめて)/.test(t)) {
        const done = (state.data.tasks || []).filter((x) => x.done).length;
        return { reply: `これまでに ${done} 件のタスクを完了しています。「記録」→「週次」から振り返りを記録できます。` };
      }
      return { reply: '承知しました。例えば「明日10時にジムへ行く予定を追加して」「今日は何をすればいい？」「最近できていないことを教えて」などにお答えできます。' };
    }
    function parseWhen(t) {
      const base = new Date();
      let date = todayStr();
      if (/明後日/.test(t)) date = ymd(addDays(base, 2));
      else if (/明日/.test(t)) date = ymd(addDays(base, 1));
      else if (/今日/.test(t)) date = todayStr();
      const m = t.match(/(\d{1,2})\s*時(?:\s*(\d{1,2})\s*分)?/);
      let time = '';
      if (m) time = pad(Number(m[1])) + ':' + pad(Number(m[2] || 0));
      else { const m2 = t.match(/(\d{1,2}):(\d{2})/); if (m2) time = pad(Number(m2[1])) + ':' + m2[2]; }
      return { date, time };
    }
    function guessTitle(t) {
      let s = t.replace(/(明日|今日|明後日)/g, '').replace(/\d{1,2}\s*時(\s*\d{1,2}\s*分)?/g, '').replace(/\d{1,2}:\d{2}/g, '')
        .replace(/(に|へ|を|の)?\s*(予定|タスク|todo)?\s*(を)?\s*(追加|入れて|登録|にして)(して)?/gi, '').trim();
      s = s.replace(/^[\sにへをでの、,]+/, '').trim(); // 先頭に残る助詞を除去
      return s || '新しい予定';
    }

    // ================= 通知 =================
    async function requestNotify() {
      if (typeof Notification === 'undefined') { alert('この環境はブラウザ通知に対応していません。'); return; }
      try { await Notification.requestPermission(); renderRecord(); } catch (e) {}
    }
    async function savePrefs(patch) {
      const notify = { ...notifyPrefs(), ...patch };
      state.data.prefs = { ...(state.data.prefs || {}), notify };
      try { await api('/api/prefs', 'PATCH', { notify }); } catch (e) {}
    }
    function toggleNotify(k) { const p = notifyPrefs(); savePrefs({ [k]: !p[k] }).then(() => renderRecord()); }
    function setNotifyTime(k, v) { savePrefs({ [k]: v }); }

    let firedKeys = null;
    function loadFired() { if (firedKeys) return firedKeys; try { firedKeys = new Set(JSON.parse(localStorage.getItem('rina-fired') || '[]')); } catch (e) { firedKeys = new Set(); } return firedKeys; }
    function markFired(k) { const s = loadFired(); s.add(k); try { localStorage.setItem('rina-fired', JSON.stringify([...s].slice(-200))); } catch (e) {} }
    function notify(title, body) {
      toast(body || title);
      if (typeof Notification !== 'undefined' && Notification.permission === 'granted') { try { new Notification(title, { body, icon: '/icon.svg' }); } catch (e) {} }
    }
    function scanReminders() {
      if (!state.data) return;
      const p = notifyPrefs(); const now = new Date(); const nowMin = now.getHours() * 60 + now.getMinutes(); const today = todayStr();
      // 予定前の通知
      if (p.eventBefore) {
        eventsOn(today).forEach((e) => {
          const s = timeToMin(e.startTime); if (s == null) return;
          const lead = e.notifyMin || 30;
          if (s - nowMin <= lead && s - nowMin >= 0) { const key = 'ev' + e.id + today; if (!loadFired().has(key)) { markFired(key); notify('まもなく予定', `${e.startTime} ${e.title}${e.place ? '（' + e.place + '）' : ''}`); } }
        });
      }
      // 朝のブリーフィング / 夜の振り返り
      const hitTime = (label) => label ? (timeToMin(label) != null && Math.abs(nowMin - timeToMin(label)) <= 1) : false;
      if (p.morning && hitTime(p.morningTime)) { const key = 'am' + today; if (!loadFired().has(key)) { markFired(key); notify('おはようございます', `${USER}、本日の予定と優先事項をまとめました。`); } }
      if (p.night && hitTime(p.nightTime)) { const key = 'pm' + today; if (!loadFired().has(key)) { markFired(key); notify('本日もお疲れさまでした', '3分だけ、今日の振り返りをしませんか？'); } }
    }

    // ================= フォーカスタイマー（25分集中） =================
    function startFocus(taskId, minutes) {
      const t = taskId ? (state.data.tasks || []).find((x) => x.id === taskId) : null;
      const total = (minutes || 25) * 60;
      if (state.timer && state.timer.intervalId) clearInterval(state.timer.intervalId);
      state.timer = { taskId, name: t ? t.title : '集中タイム', total, remaining: total, paused: false, intervalId: null };
      document.getElementById('focus-name').textContent = state.timer.name;
      document.getElementById('focus').classList.add('show');
      renderFocus();
      state.timer.intervalId = setInterval(tickFocus, 1000);
      toast('25分の集中を始めます。まずはこの一つだけに。');
    }
    function tickFocus() {
      const tm = state.timer; if (!tm || tm.paused) return;
      tm.remaining--;
      if (tm.remaining <= 0) {
        clearInterval(tm.intervalId); renderFocus();
        notify('集中おつかれさまでした', '5分ほど休みましょう。よく進みました。');
        document.getElementById('focus').classList.remove('show'); state.timer = null; return;
      }
      renderFocus();
    }
    function renderFocus() {
      const tm = state.timer; if (!tm) return;
      document.getElementById('focus-time').textContent = pad(Math.floor(tm.remaining / 60)) + ':' + pad(tm.remaining % 60);
      document.getElementById('focus-bar').style.width = ((tm.total - tm.remaining) / tm.total * 100) + '%';
      document.getElementById('focus-toggle').textContent = tm.paused ? '再開' : '一時停止';
    }
    function toggleFocus() { if (!state.timer) return; state.timer.paused = !state.timer.paused; renderFocus(); }
    function stopFocus() { if (state.timer && state.timer.intervalId) clearInterval(state.timer.intervalId); state.timer = null; document.getElementById('focus').classList.remove('show'); }

    // ================= 全体検索 =================
    function openSearch() { document.getElementById('search-overlay').classList.add('show'); const i = document.getElementById('search-input'); i.value = ''; runSearch(''); setTimeout(() => i.focus(), 50); }
    function closeSearch() { document.getElementById('search-overlay').classList.remove('show'); }
    function runSearch(q) {
      q = (q || '').trim().toLowerCase();
      const el = document.getElementById('search-results');
      if (!q) { el.innerHTML = '<div class="search-empty">キーワードを入力してください。</div>'; return; }
      const res = [];
      (state.data.tasks || []).forEach((t) => { if ((t.title + ' ' + t.detail).toLowerCase().includes(q)) res.push({ kind: 'タスク', title: t.title, sub: (t.done ? '完了・' : '') + (t.category || ''), go: () => { state.taskFilter = t.done ? 'done' : 'all'; go('tasks'); } }); });
      notes().forEach((n) => { if ((n.title + ' ' + n.content + ' ' + (n.tags || []).join(' ')).toLowerCase().includes(q)) res.push({ kind: 'メモ', title: n.title || '（無題）', sub: n.category, go: () => { go('record'); setRecordTab('notes'); } }); });
      events().forEach((e) => { if ((e.title + ' ' + e.place + ' ' + e.detail).toLowerCase().includes(q)) res.push({ kind: '予定', title: e.title, sub: e.date + (e.startTime ? ' ' + e.startTime : ''), go: () => { state.calCursor = new Date(e.date + 'T00:00:00'); state.calView = 'day'; go('calendar'); } }); });
      goals().forEach((g) => { if ((g.title + ' ' + g.purpose).toLowerCase().includes(q)) res.push({ kind: '目標', title: g.title, sub: '進捗 ' + g.progress + '%', go: () => { go('record'); setRecordTab('goals'); } }); });
      if (!res.length) { el.innerHTML = '<div class="search-empty">一致する項目はありません。</div>'; return; }
      window._searchRes = res.slice(0, 40);
      el.innerHTML = window._searchRes.map((r, i) => `<div class="sr" data-i="${i}"><span class="kind">${r.kind}</span><div class="txt"><div class="st">${esc(r.title)}</div><div class="ss">${esc(r.sub || '')}</div></div></div>`).join('');
      el.querySelectorAll('.sr').forEach((node) => { node.onclick = () => { const r = window._searchRes[+node.dataset.i]; closeSearch(); r.go(); }; });
    }

    // ================= バックアップ（書き出し／読み込み） =================
    async function exportData() {
      try {
        const data = await api('/api/data');
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob); const a = document.createElement('a');
        a.href = url; a.download = 'rina-backup-' + todayStr() + '.json'; a.click();
        URL.revokeObjectURL(url); toast('バックアップを書き出しました。');
      } catch (e) { alert('書き出しに失敗しました: ' + e.message); }
    }
    function importData(input) {
      const file = input.files && input.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        let obj; try { obj = JSON.parse(reader.result); } catch (e) { alert('JSONの読み込みに失敗しました。'); return; }
        const counts = ['tasks', 'notes', 'events', 'goals', 'reviews', 'dailyReviews'].map((k) => `${k}: ${Array.isArray(obj[k]) ? obj[k].length : 0}`).join(' / ');
        openModal({
          title: 'このバックアップで置き換えますか？', lead: '現在のデータはすべて上書きされます。心配な場合は先に書き出しておきましょう。',
          bodyHTML: `<div class="proposal">${esc(counts)}</div>`, okLabel: '置き換える',
          onOk: async () => { try { await api('/api/import', 'POST', obj); await refresh(); closeModal(); toast('バックアップを読み込みました。'); } catch (e) { alert('読み込みに失敗しました: ' + e.message); } },
        });
      };
      reader.readAsText(file); input.value = '';
    }

    // 期限切れのナビバッジを更新
    function updateBadges() {
      const over = state.data ? incompleteTasks().filter(isOverdue).length : 0;
      const html = over ? `<span class="navbadge">${over}</span>` : '';
      const s = document.getElementById('badge-tasks-side'); if (s) s.innerHTML = html;
      const b = document.getElementById('badge-tasks-bn'); if (b) b.innerHTML = html;
    }

    // ================= モーダル・トースト =================
    let modalOk = null;
    function openModal({ title, lead, bodyHTML, okLabel, onOk }) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-lead').textContent = lead || '';
      document.getElementById('modal-body').innerHTML = bodyHTML || '';
      const ok = document.getElementById('modal-ok'); ok.textContent = okLabel || '実行する';
      modalOk = onOk; document.getElementById('overlay').classList.add('show');
    }
    function closeModal() { document.getElementById('overlay').classList.remove('show'); modalOk = null; }
    document.getElementById('modal-ok').addEventListener('click', () => { if (modalOk) modalOk(); });
    document.getElementById('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') closeModal(); });
    document.getElementById('search-overlay').addEventListener('click', (e) => { if (e.target.id === 'search-overlay') closeSearch(); });

    let toastTimer = null;
    function toast(msg, action) {
      document.getElementById('toast-msg').textContent = msg;
      const el = document.getElementById('toast'); const btn = document.getElementById('toast-action');
      if (action && action.label && typeof action.fn === 'function') {
        btn.textContent = action.label; btn.style.display = '';
        btn.onclick = () => { el.classList.remove('show'); action.fn(); };
      } else { btn.style.display = 'none'; btn.onclick = null; }
      el.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), action ? 6000 : 3200);
    }

    // ================= 更新 =================
    async function refresh() { state.data = await api('/api/data'); renderCurrent(); }

    // メモ検索（フォーカスを保ちながら絞り込み）
    function onNoteSearch(v) {
      state.noteSearch = v; renderRecord();
      const box = document.getElementById('n-search');
      if (box) { box.focus(); const len = box.value.length; box.setSelectionRange(len, len); }
    }

    // PWA: Service Worker 登録
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    // 起動
    (async function boot() {
      await loadData();
      scanReminders();
      setInterval(scanReminders, 60000); // 1分ごとにリマインダーを確認
    })();
  </script>
